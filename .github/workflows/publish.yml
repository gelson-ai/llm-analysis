name: Publish dashboard

# Three ways this runs:
#   schedule        - the weekly refresh: Monday 00:00 UTC == Monday 08:00 Asia/Manila (UTC+8, no DST)
#   workflow_dispatch - manual "Run workflow" click, and what the refresh button's proxy triggers
#   push            - a human edit; republish only, no network fetch
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/**"
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"

# GITHUB_TOKEN is read-only unless asked otherwise: contents to push the
# refreshed data back, pages + id-token to deploy.
permissions:
  contents: write
  pages: write
  id-token: write

# refresh.py guards itself with a lock file, but that only works on ONE
# machine - two runners have separate filesystems, so without this they could
# both fetch and lock conflicting weekly picks. cancel-in-progress stays false
# so a run is never killed partway through committing.
concurrency:
  group: publish-dashboard
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Regression gate: the suite is fully offline (requests is monkeypatched
      # against a local fixture), so it costs ~10s and needs no secrets.
      - name: Run tests
        run: python -m pytest tests/ -q

      # Only on schedule/manual runs, and always fetch-then-build: refresh.py
      # aborts WITHOUT republishing if the fetch fails, so a bad scrape can
      # never replace a good dashboard. --max-age-hours 192 (not the 72h
      # default) leaves headroom for a weekly cadence.
      - name: Refresh data and rebuild dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python dashboard/refresh.py --max-age-hours 192

      # GITHUB_TOKEN commits do not re-trigger this workflow, so there is no
      # loop. Pages is deployed later in this same job instead.
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data dashboard
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Weekly refresh: update OpenRouter data and dashboard"
            git push
          fi

      # The dashboard is a single self-contained HTML file, so "the site" is
      # just it, renamed index.html, plus the status sidecar the refresh
      # button's proxy reads.
      - name: Stage site
        run: |
          mkdir -p _site
          cp dashboard/price_performance_final.html _site/index.html
          cp dashboard/status.json _site/status.json

      # configure-pages reads this repo's Pages config and fails fast with a
      # clear message if Pages is not switched on yet, so enabling it is a
      # manual one-time click: Settings -> Pages -> Source = "GitHub Actions".
      # The action does have an `enablement: true` option, but its docs say it
      # "requires a token other than GITHUB_TOKEN" (a PAT or GitHub App), so it
      # cannot be used from here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
