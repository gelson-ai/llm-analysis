name: Publish dashboard

# Three ways this runs:
#   schedule        - the weekly refresh: Monday 00:00 UTC == Monday 08:00 Asia/Manila (UTC+8, no DST)
#   workflow_dispatch - manual "Run workflow" click, and what the refresh button's proxy triggers.
#                     Its `targets` input picks which dashboards to refresh; the button
#                     itself always dispatches the default (all).
#   push            - a human edit; republish only, no network fetch
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: "Which dashboards to refresh"
        type: choice
        options:
          - all
          - chat
          - media
          - video
        default: all
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/**"
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/publish.yml"

# GITHUB_TOKEN is read-only unless asked otherwise: contents to push the
# refreshed data back, pages + id-token to deploy.
permissions:
  contents: write
  pages: write
  id-token: write

# refresh.py guards itself with a lock file, but that only works on ONE
# machine - two runners have separate filesystems, so without this they could
# both fetch and lock conflicting weekly picks. cancel-in-progress stays false
# so a run is never killed partway through committing.
concurrency:
  group: publish-dashboard
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Must exceed 3x refresh_all.py's per-target ceiling: the unified refresh
    # gives each of the three pipelines up to 10 minutes, and killing the job
    # mid-pipeline would throw away results the other pipelines had already
    # produced.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Regression gate: the suite is fully offline (requests is monkeypatched
      # against a local fixture), so it costs ~10s and needs no secrets.
      - name: Run tests
        run: python -m pytest tests/ -q

      # One step, ALL THREE pipelines. dashboard/refresh_all.py runs refresh.py
      # (chat), refresh_media.py (image) and refresh_video.py (video) as separate
      # processes and reports each outcome separately, so a video failure can
      # never stop the chat or image dashboards from updating - or the reverse.
      # That separation is why the three are not merged into one script.
      #
      # continue-on-error keeps the job alive so whatever DID succeed is still
      # committed and deployed; a refresh failure must not leave the site
      # serving nothing. The final step below turns a failure into a failed run
      # only AFTER the deploy, because the refresh button's proxy reads the
      # run's conclusion to decide what to report.
      #
      # Each pipeline keeps its own freshness window, and both are 192h (not the
      # chat 72h default) to leave headroom for a weekly cadence.
      - name: Refresh data and rebuild dashboards
        id: refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python dashboard/refresh_all.py \
            --targets "${{ inputs.targets || 'all' }}" \
            --chat-max-age-hours 192 \
            --media-max-age-hours 192 \
            --video-max-age-hours 192

      # GITHUB_TOKEN commits do not re-trigger this workflow, so there is no
      # loop. Pages is deployed later in this same job instead.
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data dashboard
          if git diff --cached --quiet; then
            echo "Nothing changed - no commit needed."
          else
            git commit -m "Weekly refresh: update OpenRouter data and dashboard"
            git push
          fi

      # The dashboard is a single self-contained HTML file, so "the site" is
      # just it, renamed index.html, plus the status sidecar the refresh
      # button's proxy reads.
      #
      # dashboard/media_status.json, dashboard/video_status.json and
      # dashboard/refresh_status.json are deliberately NOT staged: the Worker
      # reads all three from the repository via the Contents API (see
      # cloudflare-worker/worker.js), and nothing in the browser requests them
      # directly. Adding them here would be dead weight.
      - name: Stage site
        run: |
          mkdir -p _site
          cp dashboard/price_performance_final.html _site/index.html
          cp dashboard/status.json _site/status.json
          cp dashboard/image_model_analysis.html _site/image_model_analysis.html
          cp dashboard/video_model_analysis.html _site/video_model_analysis.html

      # configure-pages reads this repo's Pages config and fails fast with a
      # clear message if Pages is not switched on yet, so enabling it is a
      # manual one-time click: Settings -> Pages -> Source = "GitHub Actions".
      # The action does have an `enablement: true` option, but its docs say it
      # "requires a token other than GITHUB_TOKEN" (a PAT or GitHub App), so it
      # cannot be used from here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Last, deliberately. Everything above has already run, so a partial
      # refresh failure still publishes the dashboard that succeeded - and the
      # run is still marked failed, which is what the refresh button reports.
      # The per-dashboard detail is in dashboard/refresh_status.json, which the
      # previous step committed.
      - name: Fail the run if a dashboard failed to refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::A dashboard refresh failed. See the refresh step log, and dashboard/refresh_status.json for which target failed."
          exit 1
